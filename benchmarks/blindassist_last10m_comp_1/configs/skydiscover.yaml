language: python
max_iterations: 10
checkpoint_interval: 10
log_level: "INFO"
random_seed: 101
max_parallel_iterations: 1
diff_based_generation: false
max_solution_length: 30000

llm:
  models:
    - name: "codex-cli/gpt-5.6-sol"
      weight: 1.0
  reasoning_effort: "medium"
  max_tokens: 12000
  timeout: 900
  retries: 1
  retry_delay: 5

search:
  type: "best_of_n"
  database:
    best_of_n: 3
  num_context_programs: 2

prompt:
  system_message: |-
    Improve only the Last10mPolicy decide(observation, memory) EVOLVE-BLOCK.
    Preserve its exact three-value interface and use only the Python standard
    library. Optimize a conservative, stable, target-driven closed-loop policy.
    Safety is a hard gate: never trade unsafe motion for efficiency. Do not
    infer hidden graph topology or an oracle action sequence. Use observations
    and bounded JSON-serializable memory, avoid left/right oscillation, verify
    before locking, stop on uncertainty, and reacquire before advancing.

evaluator:
  timeout: 60
  max_retries: 0
  cascade_evaluation: false
  inject_evaluator_context: true

monitor:
  enabled: false

language: python
max_iterations: 6
checkpoint_interval: 1
log_level: "INFO"
random_seed: 411
max_parallel_iterations: 1
diff_based_generation: false
max_solution_length: 30000

llm:
  models:
    - name: "codex-cli/gpt-5.6-sol"
      codex_executable: "C:/Users/26442/.codex/.sandbox-bin/codex.exe"
      weight: 1.0
  reasoning_effort: "medium"
  max_tokens: 12000
  timeout: 900
  retries: 1
  retry_delay: 5

search:
  type: "evox"
  share_llm: true
  database:
    auto_generate_variation_operators: true
    database_file_path: "benchmarks/blindassist_last10m_struct_search_1/search_strategies/sky_best_of_three_initial.py"
  num_context_programs: 2

prompt:
  system_message: |-
    Improve only the EVOLVE-BLOCK while preserving the six named structured
    contracts and decide(observation, memory)'s exact three-value interface.
    Use no imports, files, network, processes, hidden topology, or oracle action
    sequence. Safety is a hard gate. Search may combine or modify the contracts
    using current observations and bounded JSON-serializable memory. The names
    of temporal primitives are expert prior; no specific progress or termination
    implementation is supplied.

evaluator:
  timeout: 60
  max_retries: 0
  cascade_evaluation: false
  inject_evaluator_context: false

monitor:
  enabled: false

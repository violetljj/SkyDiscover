language: python
max_iterations: 1
checkpoint_interval: 1
log_level: "INFO"
random_seed: 1701
max_parallel_iterations: 1
diff_based_generation: false
max_solution_length: 30000

llm:
  models:
    - name: "codex-cli/gpt-5.6-sol"
      codex_executable: "E:/codex-tools/bin/codex.exe"
      weight: 1.0
  reasoning_effort: "medium"
  max_tokens: 12000
  timeout: 900
  retries: 0
  retry_delay: 5

search:
  type: "incumbent_only"
  num_context_programs: 0

prompt:
  system_message: |-
    L10M-STRUCT-COMPONENT-1 uses a frozen component-isolation scaffold.
    Return complete Python source, change the exact comment
    `# CANDIDATE-TAG: initial` to `# CANDIDATE-TAG: generated`, and preserve
    exact bytes outside that common inert tag and the assigned function body or
    bodies. Do not add functions, imports, files, network,
    processes, hidden topology, oracle action sequences, or new safety,
    tracking, termination, or composition logic. Safety is immutable and hard.
    The evaluator rejects the entire candidate before import if any locked byte
    or component capability boundary changes. ARM_INSTRUCTION_IS_APPENDED_BY_HARNESS.

evaluator:
  timeout: 60
  max_retries: 0
  cascade_evaluation: false
  inject_evaluator_context: false

monitor:
  enabled: false
